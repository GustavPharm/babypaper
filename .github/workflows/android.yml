name: Build Android APK

# 手动触发：GitHub 仓库 Actions 页点 "Run workflow"，或 gh workflow run android.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp -r index.html assets data manifest.webmanifest sw.js www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Use BabyPaper launcher icons
        run: cp -r android-icon-res/* android/app/src/main/res/

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: babypaper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
