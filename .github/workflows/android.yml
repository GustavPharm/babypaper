name: Build Android APK

# 手动触发：GitHub 仓库 Actions 页点 "Run workflow"。
# 版本号取自 package.json 的 version，安装包名为 babypaper-v<版本号>.apk。
# 勾选 release 时，打包完成后以标签 v<版本号> 发布到 Releases，
# 说明文字取自 docs/releases/v<版本号>.md（发版前先写好这个文件）。
on:
  workflow_dispatch:
    inputs:
      release:
        description: 打包完成后发布到 Releases（标签 v<package.json 版本号>）
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 只有发布那一步用得到
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version
        id: ver
        env:
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}   # 查询同名 Release 是否已存在
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "package.json 的 version 不是 x.y.z：$VERSION"; exit 1; }
          IFS=. read -r MA MI PA <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = "true" ]; then
            test -f "docs/releases/v$VERSION.md" || { echo "缺发布说明 docs/releases/v$VERSION.md"; exit 1; }
            if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION 已存在，先改 package.json 的版本号"; exit 1; fi
          fi
        shell: bash

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp -r index.html assets data manifest.webmanifest sw.js www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Use BabyPaper launcher icons
        run: cp -r android-icon-res/* android/app/src/main/res/

      - name: Set app version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.BABYPAPER_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.BABYPAPER_KEY_PASS }}
          APK: babypaper-v${{ steps.ver.outputs.version }}.apk
        run: |
          echo "${{ secrets.BABYPAPER_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias babypaper --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: babypaper-apk
          path: babypaper-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" "babypaper-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "宝宝文献 · 药学版 v$VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
