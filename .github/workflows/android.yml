name: Build Android APK

# 手动触发：GitHub 仓库 Actions 页点 "Run workflow"，或 gh workflow run android.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp -r index.html assets data manifest.webmanifest sw.js www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Use BabyPaper launcher icons
        run: cp -r android-icon-res/* android/app/src/main/res/

      - name: Sync web assets
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.BABYPAPER_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.BABYPAPER_KEY_PASS }}
        run: |
          echo "${{ secrets.BABYPAPER_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias babypaper --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out babypaper-v1.0.0.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs babypaper-v1.0.0.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: babypaper-apk
          path: babypaper-v1.0.0.apk
          if-no-files-found: error
